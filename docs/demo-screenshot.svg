<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <!-- Morandi Canvas Background -->
  <rect width="1200" height="780" rx="18" fill="#F2EFE9" />

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="58" rx="18" fill="#FAF8F5" />
  <line x1="0" y1="58" x2="1200" y2="58" stroke="#D8D2C9" stroke-width="1.5" />
  <text x="36" y="36" class="font-sans" font-size="20" font-weight="800" fill="#3D3A36">CardLedger</text>

  <!-- Nav Tabs -->
  <text x="430" y="35" class="font-sans" font-size="14" font-weight="600" fill="#6E685F">權益總表</text>
  <text x="520" y="35" class="font-sans" font-size="14" font-weight="800" fill="#3D3A36">報銷追蹤</text>
  <line x1="518" y1="46" x2="578" y2="46" stroke="#667889" stroke-width="3" />
  <text x="610" y="35" class="font-sans" font-size="14" font-weight="600" fill="#6E685F">季度與滿額</text>
  <text x="712" y="35" class="font-sans" font-size="14" font-weight="600" fill="#6E685F">刷卡攻略</text>

  <!-- Top Action Buttons -->
  <rect x="975" y="15" width="102" height="30" rx="8" fill="#E5EAEF" stroke="#C5D0DA" />
  <text x="1026" y="34" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#3A4956">複製試算表</text>
  <rect x="1088" y="15" width="76" height="30" rx="8" fill="#5C7062" />
  <text x="1126" y="34" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#FAF8F5">CSV</text>

  <!-- Hero & KPI Section Card -->
  <rect x="32" y="76" width="1136" height="166" rx="16" fill="#FAF8F5" stroke="#D8D2C9" stroke-width="1.5" />
  <text x="54" y="104" class="font-sans" font-size="12" font-weight="600" fill="#6E685F">信用卡福利追蹤表 · 紀錄日：2026-10-03 · 支援 Google Calendar 提醒</text>
  <text x="54" y="130" class="font-sans" font-size="22" font-weight="800" fill="#3D3A36">信用卡福利追蹤表 (2026-10-03 Edition)</text>

  <!-- Layout Mode Switcher -->
  <rect x="960" y="96" width="186" height="34" rx="10" fill="#E6E2DD" />
  <rect x="964" y="100" width="90" height="26" rx="8" fill="#5A6B7C" />
  <text x="1009" y="117" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#FAF8F5">精簡卡片</text>
  <text x="1100" y="117" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#635E57">精簡表格</text>

  <line x1="54" y1="144" x2="1146" y2="144" stroke="#E6E1D9" stroke-width="1" />

