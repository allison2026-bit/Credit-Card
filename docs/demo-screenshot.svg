    <rect x="764" y="0" width="84" height="36" rx="6" fill="#5A6B7C" />
    <text x="806" y="22" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#FAF8F5">10月 當期$10</text>
    <rect x="856" y="0" width="84" height="36" rx="6" fill="#FAF8F5" stroke="#CFC8BE" />
    <text x="898" y="22" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#3D3A36">11月 可用</text>
