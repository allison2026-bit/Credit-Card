  <text x="1128" y="476" text-anchor="end" class="font-mono" font-size="18" font-weight="800" fill="#3B4D40">剩 $25</text>

  <rect x="628" y="508" width="160" height="44" rx="8" fill="#E3EBE4" stroke="#C2D1C4" />
  <text x="708" y="525" text-anchor="middle" class="font-sans" font-size="10" font-weight="700" fill="#3B4D40">已使用</text>
  <text x="708" y="543" text-anchor="middle" class="font-mono" font-size="13" font-weight="800" fill="#3B4D40">$0</text>

  <rect x="798" y="508" width="160" height="44" rx="8" fill="#EFE3E1" stroke="#D8C0BC" />
  <text x="878" y="525" text-anchor="middle" class="font-sans" font-size="10" font-weight="700" fill="#5E3F3C">過期無法用</text>
  <text x="878" y="543" text-anchor="middle" class="font-mono" font-size="13" font-weight="800" fill="#5E3F3C">$75</text>

  <rect x="968" y="508" width="160" height="44" rx="8" fill="#E5EAEF" stroke="#C5D0DA" />
  <text x="1048" y="525" text-anchor="middle" class="font-sans" font-size="10" font-weight="700" fill="#3A4956">尚餘可用</text>
  <text x="1048" y="543" text-anchor="middle" class="font-mono" font-size="13" font-weight="800" fill="#3A4956">$25</text>

