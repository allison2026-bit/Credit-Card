  <text x="344" y="176" class="font-sans" font-size="11" font-weight="700" fill="#574B35">年度總年費 vs 總福利</text>
  <text x="344" y="200" class="font-mono" font-size="19" font-weight="800" fill="#3D3A36">$380 <tspan font-size="13" fill="#867F75">/</tspan> <tspan fill="#3B4D40">$1,390</tspan></text>
  <text x="344" y="218" class="font-sans" font-size="11" fill="#6B5D43">淨潛在價值 +$1,010</text>

  <!-- KPI 3 -->
  <rect x="606" y="156" width="260" height="72" rx="12" fill="#EFE3E1" stroke="#D8C0BC" />
  <text x="620" y="176" class="font-sans" font-size="11" font-weight="700" fill="#5E3F3C">已用金額 / 已過期失效</text>
  <text x="620" y="200" class="font-mono" font-size="19" font-weight="800" fill="#3B4D40">$0 <tspan font-size="13" fill="#867F75">/</tspan> <tspan fill="#61413E">-$240</tspan></text>
  <text x="620" y="218" class="font-sans" font-size="11" fill="#75524E">含過期額度自動扣除</text>

